# Local environment: SQL Server + API + demo data.
# Usage: cp .env.example .env (fill DB_PASSWORD and JWT_SECRET) && docker compose up --build
services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - techflow-db:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      retries: 30

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${DB_PASSWORD}
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -b -Q "IF DB_ID('techflow') IS NULL CREATE DATABASE techflow"

  app:
    build: .
    env_file: .env
    environment:
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=techflow;encrypt=true;trustServerCertificate=true"
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8089:8089"

  # Loads fictitious demo data (login demo / demo123) once the app has created the schema.
  seed:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      - app
    environment:
      SQLCMDPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/demo-seed.sql:/seed.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        until /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -d techflow -b -h -1 -Q "SET NOCOUNT ON; IF OBJECT_ID('tflow_chamado_categoria') IS NULL OR NOT EXISTS (SELECT 1 FROM tflow_chamado_categoria WHERE categoria = 'TI') OR (SELECT COUNT(*) FROM tflow_acesso) < 5 RAISERROR('wait', 16, 1)" >/dev/null 2>&1; do sleep 3; done
        /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -d techflow -b -i /seed.sql

volumes:
  techflow-db:
