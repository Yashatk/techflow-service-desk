name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Techflow_Base/Techflow_Web_Fonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t techflow:ci Techflow_Base/Techflow_Web_Fonte
