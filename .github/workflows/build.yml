name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          def pct(missed, covered):
              m = sum(int(r[missed]) for r in rows); c = sum(int(r[covered]) for r in rows)
              return 100 * c / (m + c) if m + c else 0
          print('### Cobertura de testes (JaCoCo)')
          print(f"- Linhas: {pct('LINE_MISSED','LINE_COVERED'):.1f}%")
          print(f"- Branches: {pct('BRANCH_MISSED','BRANCH_COVERED'):.1f}%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/target/site/jacoco

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t techflow:ci backend
