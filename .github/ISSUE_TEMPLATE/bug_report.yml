name: Bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options: [backend / web, mobile, desktop, documentação]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Acesse …\n2. Clique em …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e resultado obtido
    validations:
      required: true
  - type: input
    id: correlation
    attributes:
      label: Correlation ID (header X-Correlation-Id da resposta, se houver)
  - type: textarea
    id: context
    attributes:
      label: Ambiente
      placeholder: "Versão, navegador, Docker ou execução local"
